<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <style>
      @font-face { font-family: "Archivo"; src: url("vendor/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Archivo"; src: url("vendor/fonts/archivo-latin-ext-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: "Inter"; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+FEFF, U+FFFD; }
      @font-face { font-family: "Inter"; src: url("vendor/fonts/inter-latin-ext-600-normal.woff2") format("woff2"); font-weight: 600; font-display: block; unicode-range: U+0100-02AF, U+1E00-1E9F; }

      :root {
        /* Amazing AI brandbook */
        --ink: #07051a;
        --deep: #0d0b1e;
        --violet: #5e44e4;
        --lilac: #9570ff;
        --magenta: #df0ec4;
        --white: #ffffff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: radial-gradient(70% 80% at 50% 45%, #1c0f4a 0%, #0d0b1e 45%, #07051a 100%);
        font-family: "Archivo", "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #three-layer { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(85% 85% at 50% 50%, rgba(7, 5, 26, 0) 55%, rgba(7, 5, 26, 0.85) 100%);
      }
      #flash { position: absolute; inset: 0; background: radial-gradient(40% 40% at 50% 42%, rgba(255, 240, 255, 0.9), rgba(223, 14, 196, 0) 70%); opacity: 0; pointer-events: none; mix-blend-mode: screen; }

      .scene-content {
        position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: flex-end; padding: 0 160px 150px; gap: 22px; pointer-events: none;
      }
      /* Broadcast lockup: wide grotesk headline + tracked strap, news-channel style */
      #lockup { display: flex; flex-direction: column; align-items: center; gap: 26px; }
      #headline-wrap { position: relative; }
      #headline {
        font-family: "Archivo", sans-serif; font-stretch: 125%; font-weight: 800; font-size: 118px; line-height: 1;
        letter-spacing: 0.015em; text-transform: uppercase; color: var(--white); white-space: nowrap;
        text-shadow: 0 0 34px rgba(149, 112, 255, 0.55); clip-path: inset(0 100% 0 0);
      }
      #headline .ai {
        color: #c9a6ff; margin-right: 0.22em;
        text-shadow: 0 0 26px rgba(223, 14, 196, 0.75), 0 0 8px rgba(149, 112, 255, 0.9);
      }
      #sweep {
        position: absolute; top: -18px; bottom: -18px; left: 0; width: 10px; border-radius: 5px; opacity: 0;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 30%, #ffd0f6 70%, rgba(255, 255, 255, 0));
        box-shadow: 0 0 26px 8px rgba(223, 14, 196, 0.75), 0 0 60px 18px rgba(149, 112, 255, 0.45);
      }
      #strap { position: relative; padding: 14px 44px 13px; }
      #strap-bg {
        position: absolute; inset: 0; border-radius: 4px; transform: scaleX(0);
        background: linear-gradient(90deg, var(--violet) 0%, var(--magenta) 100%);
        box-shadow: 0 0 34px rgba(223, 14, 196, 0.5);
      }
      #strap-text {
        position: relative; font-family: "Archivo", sans-serif; font-stretch: 115%; font-weight: 600; font-size: 36px;
        line-height: 1; letter-spacing: 0.46em; margin-right: -0.46em; text-transform: uppercase; color: var(--white); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-width="1920" data-height="1080">
      <canvas id="three-layer" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="flash"></div>
      <div class="scene-content" id="overlay">
        <div id="lockup" aria-label="AI hírek a nagyvilágból">
          <div id="headline-wrap"><div id="headline"><span class="ai">AI</span>hírek</div><div id="sweep"></div></div>
          <div id="strap"><div id="strap-bg"></div><div id="strap-text">a nagyvilágból</div></div>
        </div>
      </div>
    </div>

    <script>
      // ── HTML overlay: broadcast lockup (GSAP, paused, seek-driven) ──
      (function () {
        const tl = gsap.timeline({ paused: true });
        const T_TAG = 3.25;
        // headline wiped on behind a glowing scan bar
        const hw = document.getElementById("headline").getBoundingClientRect().width;
        tl.fromTo("#headline", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.inOut" }, T_TAG);
        tl.fromTo("#sweep", { x: 0, autoAlpha: 1 }, { x: hw, autoAlpha: 1, duration: 0.6, ease: "power3.inOut" }, T_TAG);
        tl.to("#sweep", { autoAlpha: 0, duration: 0.25, ease: "power2.in" }, T_TAG + 0.55);
        // strap bar snaps open from the centre, then the tracked line settles in
        tl.fromTo("#strap-bg", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, T_TAG + 0.4);
        tl.fromTo("#strap-text", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, T_TAG + 0.6);
        // a second, softer scan across the finished lockup
        tl.fromTo("#sweep", { x: 0, autoAlpha: 0 }, { x: hw, autoAlpha: 0.55, duration: 0.7, ease: "power2.inOut" }, 4.75);
        tl.to("#sweep", { autoAlpha: 0, duration: 0.2 }, 5.25);
        // logo landing flash (the 3D logo lands at 3.0s)
        tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.12, ease: "power2.out" }, 2.92);
        tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.in" }, 3.04);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>

    <script type="module">
      import * as THREE from "three";
      import { SVGLoader } from "three/addons/loaders/SVGLoader.js";

      // ── deterministic helpers ──
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      const easeOut3 = (x) => 1 - Math.pow(1 - x, 3);
      const easeInOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const backOut = (x, s = 1.4) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);

      const PAL = { violet: 0x5e44e4, lilac: 0x9570ff, magenta: 0xdf0ec4, white: 0xffffff, ice: 0xbfd7ff };

      // ── renderer / scene / camera ──
      const canvas = document.getElementById("three-layer");
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1920 / 1080, 0.1, 200);

      scene.add(new THREE.HemisphereLight(0xb9a6ff, 0x1a0b40, 1.4));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(3, 4, 8);
      scene.add(key);
      const sweep = new THREE.PointLight(0xffc8ff, 0, 30, 1.2); // glint that slides across the logo
      scene.add(sweep);

      // soft round sprite texture for points / glows
      function glowTexture(inner = "rgba(255,255,255,1)", outer = "rgba(255,255,255,0)") {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const g = c.getContext("2d");
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, inner);
        gr.addColorStop(0.25, inner.replace(/[\d.]+\)$/, "0.55)"));
        gr.addColorStop(1, outer);
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }
      const DOT = glowTexture();

      // ── 1. warp starfield (streaks rushing past, then a slow drift) ──
      const STARS = 1400;
      const rs = mulberry32(7);
      const star = [];
      for (let i = 0; i < STARS; i++) {
        const ang = rs() * Math.PI * 2, rad = 1.5 + rs() * 22;
        star.push({ x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 0.62, z0: -rs() * 120 });
      }
      const starPos = new Float32Array(STARS * 6);
      const starCol = new Float32Array(STARS * 6);
      const starGeo = new THREE.BufferGeometry();
      starGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starGeo.setAttribute("color", new THREE.BufferAttribute(starCol, 3));
      const starMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      const stars = new THREE.LineSegments(starGeo, starMat);
      scene.add(stars);
      const cA = new THREE.Color(PAL.lilac), cB = new THREE.Color(PAL.white);
      // travelled distance: fast warp that brakes by ~1.1s, then a gentle drift
      const travel = (t) => 95 * easeOut3(seg(t, 0, 1.1)) + Math.max(0, t - 1.1) * 3.2;
      function updateStars(t) {
        const d = travel(t), speed = 95 * 3 * Math.pow(1 - seg(t, 0, 1.1), 2) / 1.1 + 3.2;
        const len = Math.min(18, speed * 0.045);
        for (let i = 0; i < STARS; i++) {
          const s = star[i];
          let z = s.z0 + d;
          z = ((((z + 120) % 126) + 126) % 126) - 120; // wrap behind the camera back to depth
          const o = i * 6;
          starPos[o] = s.x; starPos[o + 1] = s.y; starPos[o + 2] = z;
          starPos[o + 3] = s.x; starPos[o + 4] = s.y; starPos[o + 5] = z - len;
          const k = 0.25 + 0.75 * clamp01((z + 120) / 120);
          const c = i % 3 ? cA : cB;
          starCol[o] = c.r * k; starCol[o + 1] = c.g * k; starCol[o + 2] = c.b * k;
          starCol[o + 3] = 0; starCol[o + 4] = 0; starCol[o + 5] = 0;
        }
        starGeo.attributes.position.needsUpdate = true;
        starGeo.attributes.color.needsUpdate = true;
        starMat.opacity = 0.9 - 0.45 * seg(t, 1.2, 2.6);
      }

      // ── 2. dotted globe with city arcs ──
      const globe = new THREE.Group();
      scene.add(globe);
      const R = 2.3;
      const ll = (lat, lon, r = R) => {
        const phi = ((90 - lat) * Math.PI) / 180, th = ((lon + 180) * Math.PI) / 180;
        return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th));
      };
      // continent-ish brightness from layered sines (stylised, seeded, no map data)
      const land = (v) => {
        const n = Math.sin(v.x * 1.9 + 1.3) * Math.cos(v.y * 2.3 - 0.4) + Math.sin(v.z * 2.1 + v.x * 0.9) * 0.8 + Math.cos(v.y * 4.1 + v.z * 1.7) * 0.35;
        return n > 0.35;
      };
      {
        const N = 9000, pos = [], col = [];
        const dim = new THREE.Color(0x3d2ca8), lit = new THREE.Color(0xf4ecff);
        for (let i = 0; i < N; i++) {
          const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y * y), th = i * 2.399963229728653;
          const v = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r).multiplyScalar(R);
          pos.push(v.x, v.y, v.z);
          const c = land(v) ? lit : dim;
          col.push(c.r, c.g, c.b);
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
        globe.userData.dots = g;
        globe.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.085, map: DOT, vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
      }
      // dark core so back-side dots are occluded + rim glow
      globe.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.985, 64, 48), new THREE.MeshBasicMaterial({ color: 0x120a3a, transparent: true, opacity: 0.88 })));
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture("rgba(149,112,255,0.9)"), color: 0xffffff, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
      halo.scale.set(R * 3.3, R * 3.3, 1);
      halo.position.z = -0.6;
      globe.add(halo);
      // latitude rings
      for (const lat of [-60, -30, 0, 30, 60]) {
        const pts = [];
        for (let k = 0; k <= 128; k++) pts.push(ll(lat, (k / 128) * 360 - 180, R * 1.003));
        globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: PAL.violet, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending })));
      }
      // world cities, Budapest as the hub
      const CITY = {
        bud: [47.5, 19.04], nyc: [40.71, -74.0], sfo: [37.77, -122.42], lon: [51.5, -0.12], tok: [35.68, 139.69],
        pek: [39.9, 116.4], blr: [12.97, 77.59], syd: [-33.87, 151.21], sao: [-23.55, -46.63], dxb: [25.2, 55.27], cpt: [-33.92, 18.42],
      };
      const ROUTES = [["bud", "nyc"], ["bud", "tok"], ["bud", "sfo"], ["bud", "blr"], ["lon", "pek"], ["nyc", "sao"], ["dxb", "syd"], ["bud", "cpt"], ["sfo", "tok"], ["lon", "dxb"]];
      const arcs = ROUTES.map(([a, b], i) => {
        const A = ll(...CITY[a], R * 1.01), B = ll(...CITY[b], R * 1.01);
        const mid = A.clone().add(B).multiplyScalar(0.5);
        const lift = R * (1.18 + 0.35 * (A.distanceTo(B) / (2 * R)));
        mid.normalize().multiplyScalar(lift);
        const curve = new THREE.QuadraticBezierCurve3(A, mid, B);
        const pts = curve.getPoints(80);
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: i % 2 ? PAL.magenta : 0xb9a0ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
        globe.add(line);
        const pulse = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT, color: 0xffd6ff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        pulse.scale.set(0.22, 0.22, 1);
        globe.add(pulse);
        return { curve, geo, line, pulse, start: 0.75 + i * 0.13, dur: 0.75 };
      });
      const cityDots = Object.values(CITY).map(([la, lo]) => {
        const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        s.position.copy(ll(la, lo, R * 1.012));
        s.scale.set(0.16, 0.16, 1);
        globe.add(s);
        return s;
      });
      function updateGlobe(t) {
        const appear = easeOut3(seg(t, 0.35, 1.5));
        const toBack = easeInOut(seg(t, 2.1, 3.0));
        globe.scale.setScalar(0.25 + 0.75 * appear + 0.5 * toBack);
        globe.position.set(0, -0.15 - 2.6 * toBack, -0.8 - 5.5 * toBack);
        globe.rotation.set(0.38 - 0.12 * toBack, 1.05 + t * 0.38, 0.12);
        const fade = 1 - 0.35 * toBack;
        globe.children.forEach((c) => { if (c.material && c.material.opacity !== undefined && c !== halo) c.material.transparent = true; });
        halo.material.opacity = (0.55 + 0.25 * Math.sin(t * 2.4)) * appear;
        for (const a of arcs) {
          const p = seg(t, a.start, a.start + a.dur);
          a.geo.setDrawRange(0, Math.max(0, Math.floor(81 * easeOut3(p))));
          a.line.material.opacity = 0.95 * fade;
          const q = ((t - a.start) / 0.9) % 1;
          a.pulse.visible = p > 0.05;
          a.pulse.position.copy(a.curve.getPoint(p < 1 ? easeOut3(p) : q));
          a.pulse.material.opacity = fade;
        }
        cityDots.forEach((d, i) => { d.material.opacity = appear * (0.7 + 0.3 * Math.sin(t * 5 + i)); });
      }

      // ── 3. extruded 3D logo (vectorised brand mark) ──
      const logo = new THREE.Group();
      scene.add(logo);
      logo.visible = false;
      const LOGO_W = 5.6; // world units at z=0
      const loadReady = new Promise((resolve) => {
        new SVGLoader().load("assets/amazing_logo.svg", (data) => {
          const capIcon = new THREE.MeshStandardMaterial({ color: 0x9a7bff, emissive: 0x3b1fb0, emissiveIntensity: 0.55, metalness: 0.55, roughness: 0.28 });
          const capText = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.55, metalness: 0.25, roughness: 0.35 });
          const side = new THREE.MeshStandardMaterial({ color: 0x5e44e4, emissive: 0x2a0f7a, emissiveIntensity: 0.6, metalness: 0.75, roughness: 0.22 });
          const inner = new THREE.Group();
          for (const path of data.paths) {
            const isIcon = path.userData.node.id === "icon";
            for (const shape of SVGLoader.createShapes(path)) {
              const geo = new THREE.ExtrudeGeometry(shape, { depth: isIcon ? 9 : 6, bevelEnabled: true, bevelThickness: 0.9, bevelSize: 0.45, bevelSegments: 3, curveSegments: 10 });
              inner.add(new THREE.Mesh(geo, [isIcon ? capIcon : capText, side]));
            }
          }
          const s = LOGO_W / 323;
          inner.scale.set(s, -s, s); // SVG is y-down
          inner.position.set(-161.5 * s, 31 * s, 0);
          logo.add(inner);
          logo.visible = true;
          resolve();
          renderAt(window.__hfThreeTime || 0);
        });
      });
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["ai-hirek-logo"] = loadReady;

      const LAND = 3.0; // logo settles
      function updateLogo(t) {
        const p = seg(t, 2.25, LAND);
        const e = backOut(p, 1.15);
        logo.position.set(0, 0.62 + (1 - p) * 0.8, -26 + 26 * e);
        logo.rotation.set((1 - p) * 0.5, -2.4 * (1 - easeOut3(p)) + 0.05 * Math.sin(Math.max(0, t - LAND) * 1.4), 0);
        const breathe = 1 + 0.012 * Math.sin(Math.max(0, t - LAND) * 2.2);
        logo.scale.setScalar(breathe);
        logo.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => { m.transparent = true; m.opacity = seg(p, 0.3, 0.65); }); });
        // light sweep across the face after landing
        const sw = seg(t, 3.05, 4.1);
        sweep.intensity = 60 * Math.sin(Math.PI * sw);
        sweep.position.set(-6 + 12 * easeInOut(sw), 1.4, 2.6);
      }

      // ── camera ──
      function updateCamera(t) {
        const push = easeInOut(seg(t, 0, 2.4));
        const settle = easeInOut(seg(t, 2.2, 3.2));
        const z = 13 - 4.5 * push + 1.2 * settle;
        const orbit = 0.35 * (1 - push) - 0.06 * settle + 0.02 * Math.sin(t * 0.9);
        camera.position.set(Math.sin(orbit) * z, 0.5 - 0.3 * push + 0.15 * settle, Math.cos(orbit) * z);
        camera.lookAt(0, 0.1 * settle, 0);
      }

      function renderAt(t) {
        updateStars(t);
        updateGlobe(t);
        if (logo.children.length) updateLogo(t);
        updateCamera(t);
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (ev) => renderAt(ev.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>

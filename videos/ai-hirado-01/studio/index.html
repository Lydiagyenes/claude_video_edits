<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      @font-face { font-family: "Archivo"; src: url("vendor/fonts/archivo-latin-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+2000-206F, U+FEFF, U+FFFD; }
      @font-face { font-family: "Archivo"; src: url("vendor/fonts/archivo-latin-ext-wdth-normal.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-display: block; unicode-range: U+0100-02AF, U+1E00-1E9F; }
      :root {
        --ink: #06041a; --deep: #0d0b1e; --violet: #5e44e4; --lilac: #9570ff; --magenta: #df0ec4; --yellow: #dfff84;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Archivo", sans-serif;
        background: radial-gradient(120% 90% at 50% 30%, #1b1050 0%, #0d0a2c 45%, #06041a 100%);
      }
      /* everything behind the presenter is slightly out of focus, like a real studio */
      #set { position: absolute; inset: 0; filter: blur(2.2px); }

      /* curved LED wall */
      #wall {
        position: absolute; left: 90px; right: 90px; top: 60px; height: 760px; border-radius: 28px;
        background:
          radial-gradient(60% 70% at 50% 45%, rgba(149, 112, 255, 0.35), rgba(94, 68, 228, 0.12) 55%, rgba(6, 4, 26, 0) 100%),
          linear-gradient(180deg, #1a0f55, #0e0833 70%, #090625);
        box-shadow: inset 0 0 120px rgba(6, 4, 26, 0.9), 0 0 80px rgba(149, 112, 255, 0.18);
        overflow: hidden;
      }
      #wall::before { /* LED pixel grid */
        content: ""; position: absolute; inset: 0; opacity: 0.35;
        background-image: radial-gradient(rgba(201, 182, 255, 0.55) 1px, transparent 1.6px);
        background-size: 9px 9px;
      }
      #wall::after { /* horizontal scan lines */
        content: ""; position: absolute; inset: 0; opacity: 0.25;
        background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.06) 0 2px, transparent 2px 7px);
      }
      /* dotted globe on the wall, echoing the intro */
      #globe {
        position: absolute; width: 760px; height: 760px; left: 50%; top: 120px; transform: translateX(-50%); border-radius: 50%;
        background:
          radial-gradient(circle at 38% 32%, rgba(201, 182, 255, 0.35), rgba(94, 68, 228, 0.18) 45%, rgba(13, 10, 44, 0.0) 70%),
          radial-gradient(circle, rgba(201, 182, 255, 0.7) 1.4px, transparent 2.2px) 0 0 / 16px 16px;
        -webkit-mask: radial-gradient(circle, #000 64%, transparent 71%); mask: radial-gradient(circle, #000 64%, transparent 71%);
        opacity: 0.55;
      }
      #globe-ring { position: absolute; width: 900px; height: 900px; left: 50%; top: 50px; transform: translateX(-50%); border-radius: 50%; border: 2px solid rgba(149, 112, 255, 0.35); box-shadow: 0 0 40px rgba(149, 112, 255, 0.25); }

      /* light columns */
      .column { position: absolute; top: 0; bottom: 0; width: 26px; border-radius: 13px; background: linear-gradient(180deg, rgba(149, 112, 255, 0), #b9a0ff 20%, #9570ff 60%, rgba(149, 112, 255, 0)); box-shadow: 0 0 40px 10px rgba(149, 112, 255, 0.55), 0 0 120px 30px rgba(94, 68, 228, 0.35); }
      #col-l { left: 200px; } #col-r { right: 200px; }
      .column.thin { width: 8px; box-shadow: 0 0 22px 6px rgba(149, 112, 255, 0.45); opacity: 0.8; }
      #col-l2 { left: 262px; } #col-r2 { right: 262px; }

      /* yellow accent strips */
      .strip { position: absolute; height: 5px; border-radius: 3px; background: var(--yellow); box-shadow: 0 0 18px 4px rgba(223, 255, 132, 0.6); }
      #strip-l { left: 90px; width: 320px; top: 838px; }
      #strip-r { right: 90px; width: 320px; top: 838px; }

      /* neon brand sign, upper right */
      #sign { position: absolute; right: 330px; top: 120px; width: 340px; filter: drop-shadow(0 0 10px rgba(201, 182, 255, 0.9)) drop-shadow(0 0 28px rgba(149, 112, 255, 0.8)); }
      /* show bug on the left screen */
      #screen-l {
        position: absolute; left: 330px; top: 170px; width: 300px; height: 170px; border-radius: 14px;
        background: linear-gradient(135deg, rgba(149, 112, 255, 0.35), rgba(13, 10, 44, 0.6)); border: 2px solid rgba(201, 182, 255, 0.35);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        box-shadow: 0 0 40px rgba(149, 112, 255, 0.35);
      }
      #screen-l .t1 { font-stretch: 125%; font-weight: 800; font-size: 44px; color: #fff; letter-spacing: 0.02em; }
      #screen-l .t1 b { color: var(--yellow); font-weight: 800; }
      #screen-l .t2 { font-stretch: 115%; font-weight: 600; font-size: 15px; letter-spacing: 0.4em; color: #fff; background: var(--lilac); padding: 6px 12px 6px 18px; border-radius: 3px; }

      /* floor / desk glow */
      #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 270px; background: linear-gradient(180deg, rgba(6, 4, 26, 0), rgba(6, 4, 26, 0.85) 60%, #05030f); }
      #floor-glow { position: absolute; left: 50%; bottom: 120px; width: 1400px; height: 160px; transform: translateX(-50%); background: radial-gradient(50% 50% at 50% 50%, rgba(149, 112, 255, 0.28), rgba(149, 112, 255, 0)); }
      /* bokeh */
      .bk { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(201, 182, 255, 0.55), rgba(149, 112, 255, 0) 70%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="studio" data-start="0" data-duration="1" data-width="1920" data-height="1080">
      <div id="set">
        <div id="wall"><div id="globe-ring"></div><div id="globe"></div></div>
        <div class="column" id="col-l"></div><div class="column thin" id="col-l2"></div>
        <div class="column" id="col-r"></div><div class="column thin" id="col-r2"></div>
        <div class="strip" id="strip-l"></div><div class="strip" id="strip-r"></div>
        <img id="sign" src="assets/amazing_logo.svg" alt="" />
        <div class="bk" style="left: 60px; top: 900px; width: 120px; height: 120px"></div>
        <div class="bk" style="left: 1700px; top: 940px; width: 90px; height: 90px"></div>
        <div class="bk" style="left: 1580px; top: 60px; width: 70px; height: 70px; opacity: 0.6"></div>
        <div class="bk" style="left: 420px; top: 40px; width: 60px; height: 60px; opacity: 0.5"></div>
        <div id="floor-glow"></div>
        <div id="floor"></div>
      </div>
    </div>
  </body>
</html>
